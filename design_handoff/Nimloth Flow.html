// --- Source Badge ---
function SourceBadge({ source, size }) {
  const s = window.SOURCE_LABELS[source];
  if (!s) return null;
  return (
    <span className={`badge ${s.cls}`}>
      <span className="swatch"></span>
      {s.label}
    </span>
  );
}

// --- Sparkline ---
function Sparkline({ data, width = 54, height = 18, color = '#0D7377' }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const span = max - min || 1;
  const step = width / (data.length - 1);
  const points = data.map((v, i) => `${(i * step).toFixed(1)},${(height - ((v - min) / span) * (height - 2) - 1).toFixed(1)}`).join(' ');
  return (
    <svg width={width} height={height} className="spark" style={{ overflow: 'visible' }}>
      <polyline fill="none" stroke={color} strokeWidth="1.25" points={points} strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={(data.length - 1) * step} cy={height - ((data[data.length-1] - min) / span) * (height - 2) - 1}
              r="1.8" fill={color}/>
    </svg>
  );
}

// --- Quality flag ---
function QualityFlag({ flags }) {
  if (!flags || !flags.length) return null;
  return (
    <span className="qflag" title={flags.join(', ')}>
      <Icon name="alert" size={14}/>
    </span>
  );
}

// --- Switch ---
function Switch({ on, onChange, label }) {
  return (
    <div className={`switch ${on ? 'on' : ''}`} onClick={() => onChange(!on)}>
      <span>{label}</span>
      <span className="sw-track"><span className="sw-thumb"/></span>
    </div>
  );
}

function CdsCard({ card }) {
  const label = card.indicator === 'critical' ? 'Kritisk' : card.indicator === 'warning' ? 'Varning' : 'Info';
  return (
    <div className={`cds-card ${card.indicator}`}>
      <div className="indicator-row">
        <span className="indicator">{label}</span>
        {card.indicator === 'critical' && <span className="pulse"/>}
      </div>
      <div className="summary">{card.summary}</div>
      {card.detail && <div className="detail">{card.detail}</div>}
      <div className="source">{card.source}</div>
      {card.suggestions && (
        <div className="suggestions">
          {card.suggestions.map((s, i) => (
            <button key={i} className={`btn btn-sm ${i === 0 && card.indicator === 'critical' ? 'btn-red' : ''}`}>
              {s}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function CdsStack({ cards }) {
  const sorted = [...cards].sort((a, b) => {
    const order = { critical: 0, warning: 1, info: 2 };
    return order[a.indicator] - order[b.indicator];
  });
  return (
    <div>
      <div className="section-head">
        <h3 className="h3">CDS-varningar</h3>
        <span className="meta">{cards.length} aktiva</span>
      </div>
      <div className="cds-stack">
        {sorted.map((c, i) => <CdsCard key={i} card={c}/>)}
      </div>
    </div>
  );
}

// ---- Vitala ----
function TrendChart({ series, dates }) {
  const W = 720, H = 220, pad = { l: 40, r: 20, t: 20, b: 30 };
  const allVals = [...series.bp_sys, ...series.bp_dia, ...series.pulse];
  const min = Math.min(...allVals) - 10;
  const max = Math.max(...allVals) + 10;
  const xStep = (W - pad.l - pad.r) / (dates.length - 1);
  const y = v => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);
  const path = arr => arr.map((v, i) => `${i===0?'M':'L'} ${pad.l + i * xStep} ${y(v)}`).join(' ');
  const yTicks = [min, Math.round((min+max)/2), max];
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{background:'var(--surface)'}}>
      {/* Reference band 120/80 */}
      <rect x={pad.l} y={y(140)} width={W-pad.l-pad.r} height={y(90)-y(140)} fill="rgba(47,125,78,0.06)"/>
      <line x1={pad.l} x2={W-pad.r} y1={y(140)} y2={y(140)} stroke="var(--line-2)" strokeDasharray="3,3"/>
      <line x1={pad.l} x2={W-pad.r} y1={y(90)} y2={y(90)} stroke="var(--line-2)" strokeDasharray="3,3"/>
      {yTicks.map(t => (
        <g key={t}>
          <line x1={pad.l} x2={W-pad.r} y1={y(t)} y2={y(t)} stroke="var(--line)"/>
          <text x={pad.l-6} y={y(t)+3} textAnchor="end" fontSize="10" fill="var(--ink-3)">{t}</text>
        </g>
      ))}
      {dates.map((d, i) => (
        <text key={i} x={pad.l + i*xStep} y={H-10} textAnchor="middle" fontSize="9" fill="var(--ink-3)">
          {d.split(' ')[0].slice(5)}
        </text>
      ))}
      <path d={path(series.bp_sys)} fill="none" stroke="#B8322C" strokeWidth="1.75"/>
      <path d={path(series.bp_dia)} fill="none" stroke="#2E5090" strokeWidth="1.75"/>
      <path d={path(series.pulse)} fill="none" stroke="#0D7377" strokeWidth="1.75"/>
      {series.bp_sys.map((v, i) => <circle key={'s'+i} cx={pad.l+i*xStep} cy={y(v)} r="2.5" fill="#B8322C"/>)}
      {series.bp_dia.map((v, i) => <circle key={'d'+i} cx={pad.l+i*xStep} cy={y(v)} r="2.5" fill="#2E5090"/>)}
      {series.pulse.map((v, i) => <circle key={'p'+i} cx={pad.l+i*xStep} cy={y(v)} r="2.5" fill="#0D7377"/>)}
    </svg>
  );
}

// ================== DATAKVALITET ==================
function QualityPage() {
  const d = window.QUALITY;
  const maxBar = Math.max(...d.byType.map(x => x.count));
  const maxTrend = Math.max(...d.bySource.flatMap(s => s.trend));
  return (
    <div className="admin-page">
      <h1>Datakvalitet</h1>
      <p className="page-sub">Data Quality Dashboard · felfrekvenser, terminologi, dubbletter</p>

      <div className="kpi-grid">
        {d.kpis.map(k => (
          <div key={k.name} className={`kpi-card ${k.ok?'ok':'warn'}`}>
            <div className="kpi-label">{k.name}</div>
            <div className="kpi-val tnum">{k.value}<span className="suffix">{k.unit}</span></div>
            <div className="kpi-foot">
              Mål {k.target} ·{' '}
              {k.delta > 0 && <span className="delta-up">▲ {k.delta}%</span>}
              {k.delta < 0 && <span className="delta-down">▼ {Math.abs(k.delta)}%</span>}
              {k.delta === 0 && <span>● stabil</span>}
            </div>
          </div>
        ))}
      </div>

      <div className="admin-section">
        <h2>Felfrekvens per typ</h2>
        <div className="card"><div className="card-body">
          {d.byType.map(b => (
            <div key={b.type} className="bar-row">
              <span className="mono" style={{fontSize:11}}>{b.type}</span>
              <div className="bar-track">
                <div className="bar-fill" style={{width:`${(b.count/maxBar)*100}%`, background: b.ok?'var(--teal)':'var(--red)'}}/>
              </div>
              <span className="tnum" style={{textAlign:'right'}}>{b.count.toLocaleString('sv-SE')}</span>
            </div>
          ))}
        </div></div>
      </div>

      <div className="admin-section">
        <h2>Felfrekvens per källsystem · senaste 7 dagar</h2>
        <div className="card"><div className="card-body">
          {d.bySource.map(s => {
            const W = 300, H = 28;
            const step = W / (s.trend.length - 1);
            const y = v => H - (v / maxTrend) * (H - 4) - 2;
            const path = s.trend.map((v,i) => `${i===0?'M':'L'} ${i*step} ${y(v)}`).join(' ');
            return (
              <div key={s.source} className="qtrend">
                <div><SourceBadge source={s.source}/></div>
                <svg width={W} height={H}>
                  <path d={path} fill="none" stroke="var(--teal)" strokeWidth="1.5"/>
                  {s.trend.map((v,i) => <circle key={i} cx={i*step} cy={y(v)} r="2" fill="var(--teal)"/>)}
                </svg>
                <span className="tnum mono" style={{textAlign:'right',fontWeight:500}}>{s.pct}%</span>
              </div>
            );
          })}
        </div></div>
      </div>
    </div>
  );
}

  return (
    <div className="search-page">
      <div className="search-hero">
        <h1>Patientsökning</h1>
        <p>Sök på personnummer eller namn i samtliga källsystem.</p>
      </div>
      <div className="search-bar">
        <input
          className="input"
          placeholder="Personnummer (ÅÅÅÅMMDD-XXXX) eller namn"
          value={query}
          onChange={e => setQuery(e.target.value)}
          autoFocus
        />
        <button className="btn btn-primary">Sök</button>
      </div>
      <div className="label" style={{marginBottom:10}}>
        {results.length} träffar {query && `för "${query}"`}
      </div>
      <div className="result-list">
        {results.map(p => (
          <div key={p.id} className="result-row" onClick={() => onSelect(p.id)}>
            <div>
              <div className="primary">
                <span className="name">{p.name}</span>
                <span className="pnr mono">{p.pnr}</span>
              </div>
              <div className="sub">
                <span className="age">{p.age} år · {p.sex}</span>
                <span className="meta">·</span>
                <div className="sources">
                  {p.sources.map(s => <SourceBadge key={s} source={s}/>)}
                </div>
                {p.cdsAlerts.some(a => a.indicator === 'critical') && (
                  <span className="badge badge-red"><span className="pulse" style={{width:5,height:5}}/> Kritisk CDS</span>
                )}
              </div>
            </div>
            <Icon name="chevronRight" size={18} className="meta"/>
          </div>
        ))}
        {results.length === 0 && (
          <div style={{padding:'40px 20px',textAlign:'center',color:'var(--ink-3)',fontSize:13}}>
            Ingen patient hittades med detta personnummer.
          </div>
        )}
      </div>
      {recent.length > 0 && (
        <div className="recent-section">
          <div className="label">Senast visade</div>
          {recent.map(id => {
            const p = window.PATIENTS.find(x => x.id === id);
            if (!p) return null;
            return (
              <span key={id} className="recent-chip" onClick={() => onSelect(id)}>
                <Icon name="clock" size={12}/>
                {p.name}
                <span className="mono meta">{p.pnr.slice(-4)}</span>
              </span>
            );
          })}
        </div>
      )}
    </div>
  );
}

function EmergencyModal({ onClose, onConfirm }) {
  const [reason, setReason] = useState('');
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-body">
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <Icon name="alert" size={20} className="qflag" style={{color:'var(--red)'}}/>
            <h2 style={{color:'var(--red)'}}>Nödöppning</h2>
          </div>
          <p>
            Du är på väg att aktivera nödöppning enligt <strong>PDL §4:1</strong>. Detta ger åtkomst till patientdata även utan dokumenterad vårdrelation.
            <strong style={{display:'block',marginTop:8}}>Händelsen loggas och granskas.</strong>
          </p>
          <div className="label" style={{marginBottom:6}}>Motivering (obligatorisk)</div>
          <textarea
            value={reason}
            onChange={e => setReason(e.target.value)}
            placeholder="Beskriv varför nödöppning behövs. T.ex. medvetslös patient, akut livshotande tillstånd, behov av läkemedelsavstämning."
          />
        </div>
        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Avbryt</button>
          <button
            className="btn btn-red"
            disabled={reason.trim().length < 10}
            onClick={() => onConfirm(reason)}
            style={{opacity: reason.trim().length < 10 ? 0.5 : 1}}
          >
            Aktivera nödöppning
          </button>
        </div>
      </div>
    </div>
  );
}

function TweaksPanel({ tweaks, setTweak, visible, onClose }) {
  if (!visible) return null;
  return (
    <div className="tweaks">
      <div className="tweaks-header">
        <span>Tweaks</span>
        <button onClick={onClose} style={{color:'rgba(255,255,255,0.7)'}}><Icon name="x" size={12}/></button>
      </div>
      <div className="tweaks-body">
        <Switch
          on={tweaks.emergencyMode}
          onChange={v => setTweak('emergencyMode', v)}
          label="Nödöppningsläge (PDL §4:1)"
        />
        <Switch
          on={tweaks.offlineMode}
          onChange={v => setTweak('offlineMode', v)}
          label="Offline-läge (simulerat)"
        />
        <div className="tweak-row">
          <label>PDL-kontext</label>
          <select
            value={tweaks.pdlContext}
            onChange={e => setTweak('pdlContext', e.target.value)}
          >
            {Object.entries(PDL_CONTEXTS).map(([k, v]) => (
              <option key={k} value={k}>{v.unit}</option>
            ))}
          </select>
        </div>
        <div style={{borderTop:'1px solid var(--line)',paddingTop:10,fontSize:11,color:'var(--ink-3)',lineHeight:1.5}}>
          Aktiva lägen visualiseras i topbar, statusbar och patientöversikt.
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('search');
  const [patientId, setPatientId] = useState(null);
  const [recent, setRecent] = useState(() => {
    try { return JSON.parse(localStorage.getItem('vgr.recent')) || []; } catch { return []; }
  });
  const [tweaks, setTweaks] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('vgr.tweaks'));
      return { ...TWEAKS_DEFAULTS, ...saved };
    } catch { return TWEAKS_DEFAULTS; }
  });
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [emergencyOpen, setEmergencyOpen] = useState(false);

  // Persist
  useEffect(() => { localStorage.setItem('vgr.recent', JSON.stringify(recent)); }, [recent]);
  useEffect(() => { localStorage.setItem('vgr.tweaks', JSON.stringify(tweaks)); }, [tweaks]);

  // Body class for mode
  useEffect(() => {
    document.body.classList.toggle('emergency-mode', tweaks.emergencyMode);
    document.body.classList.toggle('offline-mode', tweaks.offlineMode);
  }, [tweaks.emergencyMode, tweaks.offlineMode]);

  // Edit mode protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const selectPatient = (id) => {
    setPatientId(id);
    setView('patient');
    setRecent(prev => [id, ...prev.filter(x => x !== id)].slice(0, 5));
  };

  const patient = patientId ? window.PATIENTS.find(p => p.id === patientId) : null;
  const activeView = view === 'patient' && patient ? 'patient' : view;

  return (
    <div className="app">
      <Topbar tweaks={tweaks} onOpenEmergency={() => setEmergencyOpen(true)}/>
      <Sidebar
        activeView={activeView}
        setView={setView}
        patientName={patient?.firstName}
      />
      <main className="main" data-screen-label={view === 'search' ? 'Sökning' : `Patient: ${patient?.name || ''}`}>
        {tweaks.emergencyMode && (
          <div className="emergency-banner">
            <Icon name="alert" size={14}/>
            <strong>NÖDÖPPNING AKTIV</strong>
            <span>Motivering: "Medvetslös patient vid inskrivning, behov av komplett läkemedelsavstämning." · Loggat kl 14:32 · Granskas av DSO.</span>
          </div>
        )}
        {tweaks.offlineMode && (
          <div className="offline-banner">
            <Icon name="wifiOff" size={14}/>
            <strong>Offline-läge</strong>
            <span>Central hub onåbar. Visar cachedata från Edge SU. Skrivoperationer buffras lokalt.</span>
          </div>
        )}
        {view === 'search' && <SearchPage onSelect={selectPatient} recent={recent}/>}
        {view === 'patient' && patient && (
          <PatientPage
            patient={patient}
            offline={tweaks.offlineMode}
            onBack={() => setView('search')}
          />
        )}
        {view === 'system' && <SystemPage/>}
        {view === 'topology' && <TopologyPage/>}
        {view === 'quality' && <QualityPage/>}
        {view === 'audit' && <AuditPage/>}
        {view === 'settings' && <SettingsPage tweaks={tweaks} setTweak={setTweak} PDL_CONTEXTS={PDL_CONTEXTS}/>}
      </main>
      <Statusbar tweaks={tweaks}/>
      <TweaksPanel
        tweaks={tweaks}
        setTweak={setTweak}
        visible={tweaksVisible}
        onClose={() => setTweaksVisible(false)}
      />
      {emergencyOpen && (
        <EmergencyModal
          onClose={() => setEmergencyOpen(false)}
          onConfirm={(reason) => {
            setTweak('emergencyMode', true);
            setEmergencyOpen(false);
          }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
