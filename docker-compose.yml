# Nimloth Core — central single-node topologi.
# För distribuerat läge, se docker-compose.distributed.yml.
#
# Alla build:ar är multi-arch-förberedda (linux/amd64 + linux/arm64).
# Lokal `docker compose build` bygger native arch (M4 = arm64).
# För multi-arch push: kör scripts/build.sh (skapas i Prompt 11).

name: nimloth-core

x-common-build-platforms: &common-platforms
  - linux/amd64
  - linux/arm64

services:
  # --- Simulerade källsystem ---
  melior-db:
    image: postgres:16-alpine
    container_name: melior-db
    # wal_level=logical krävs för Debezium (Prompt 5).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: melior
      POSTGRES_USER: melior
      POSTGRES_PASSWORD: melior
    ports:
      - "5433:5432"
    volumes:
      - melior-data:/var/lib/postgresql/data
      - ./infra/postgres/init-melior.sql:/docker-entrypoint-initdb.d/init-melior.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melior -d melior"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - core

  asynja-db:
    image: postgres:16-alpine
    container_name: asynja-db
    # wal_level=logical krävs för Debezium (Prompt 5).
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: asynja
      POSTGRES_USER: asynja
      POSTGRES_PASSWORD: asynja
    ports:
      - "5434:5432"
    volumes:
      - asynja-data:/var/lib/postgresql/data
      - ./infra/postgres/init-asynja.sql:/docker-entrypoint-initdb.d/init-asynja.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asynja -d asynja"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - core

  core-db:
    image: postgres:16-alpine
    container_name: core-db
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    ports:
      - "5435:5432"
    volumes:
      - core-data:/var/lib/postgresql/data
      - ./infra/postgres/init-core.sql:/docker-entrypoint-initdb.d/init-core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - core

  # --- Kafka (KRaft mode) ---
  # confluentinc/cp-kafka 7.6 (Kafka 3.6 + JDK 17) — stabil på Apple Silicon.
  # apache/kafka:3.7.0 (JDK 21) kraschar med SIGILL på M-serien via Docker Desktop.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tillåt auto-skapande av topics — Debezium skapar sina per-tabell-topics
      # automatiskt. Alla domän-topics finns också pre-skapade via create-topics.sh
      # men Kafka Connect behöver kunna skapa _connect_configs/_offsets/_statuses.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # KRaft CLUSTER_ID måste vara en base64-URL-safe UUID (22 tecken).
      # Genererad en gång — används för hela projektet.
      CLUSTER_ID: "NimlothCoreKr4FtClustr"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./infra/kafka/create-topics.sh:/opt/kafka/create-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - core

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - core

  kafka-connect:
    image: debezium/connect:2.6
    # debezium/connect:2.6 JDK 21 kraschar SIGILL på Apple Silicon.
    # Kör via Rosetta-emulering (linux/amd64) tills debezium publicerar en
    # native arm64-image med kompatibel JVM.
    platform: linux/amd64
    container_name: kafka-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: core-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      melior-db:
        condition: service_healthy
      asynja-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - core

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: nimloth-core
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - core

  # --- Keycloak (identity provider) ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - core

  # --- Applikationstjänster ---
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: ingest
    environment:
      NODE_ENV: production
      INGEST_PORT: "3001"
      MELIOR_INSTANCE_ID: ${MELIOR_INSTANCE_ID:-su}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: core-ingest
      KAFKA_GROUP_ID: core-ingest-group
      CONNECT_URL: http://kafka-connect:8083
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - core

  transform:
    build:
      context: .
      dockerfile: services/transform/Dockerfile
    container_name: transform
    environment:
      NODE_ENV: production
      TRANSFORM_PORT: "3002"
      MELIOR_INSTANCE_ID: ${MELIOR_INSTANCE_ID:-su}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: core-transform
      KAFKA_GROUP_ID: core-transform-group
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Direktaccess för pre-population av patient-cache (undviker race där
      # Debezium snapshot skickar patients-events senare än andra tabeller).
      MELIOR_DB_HOST: melior-db
      MELIOR_DB_PORT: "5432"
      MELIOR_DB_NAME: melior
      MELIOR_DB_USER: melior
      MELIOR_DB_PASSWORD: melior
      ASYNJA_DB_HOST: asynja-db
      ASYNJA_DB_PORT: "5432"
      ASYNJA_DB_NAME: asynja
      ASYNJA_DB_USER: asynja
      ASYNJA_DB_PASSWORD: asynja
      LOG_LEVEL: info
    ports:
      - "3002:3002"
    depends_on:
      kafka:
        condition: service_healthy
      melior-db:
        condition: service_healthy
      asynja-db:
        condition: service_healthy
    networks:
      - core

  fhir-facade:
    build:
      context: .
      dockerfile: services/fhir-facade/Dockerfile
    container_name: fhir-facade
    environment:
      NODE_ENV: production
      FHIR_FACADE_PORT: "3003"
      FHIR_MODE: ${FHIR_MODE:-primary}
      MELIOR_INSTANCE_ID: ${MELIOR_INSTANCE_ID:-su}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: core-fhir-facade
      KAFKA_GROUP_ID: core-fhir-materializer
      CORE_DB_HOST: core-db
      CORE_DB_PORT: "5432"
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASSWORD: core
      LOG_LEVEL: info
      # Sprint 2 P3.4: 'both' krävs för ParityRunner (postgres + openehr-paritet).
      # Override till 'postgres' eller 'openehr' i andra miljöer som inte
      # behöver paritetsmätning.
      CANONICAL_STORE: ${CANONICAL_STORE:-both}
      EHRBASE_URL: ${EHRBASE_URL:-http://ehrbase:8080}
    ports:
      - "3003:3003"
    depends_on:
      kafka:
        condition: service_healthy
      core-db:
        condition: service_healthy
    networks:
      - core

  cds-hooks:
    build:
      context: .
      dockerfile: services/cds-hooks/Dockerfile
    container_name: cds-hooks
    environment:
      NODE_ENV: production
      CDS_HOOKS_PORT: "3004"
      FHIR_BASE_URL: http://fhir-facade:3003/fhir/r4
    ports:
      - "3004:3004"
    depends_on:
      - fhir-facade
    networks:
      - core

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    container_name: audit
    environment:
      NODE_ENV: production
      AUDIT_PORT: "3005"
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: core-audit
      KAFKA_GROUP_ID: core-audit-group
      AUDIT_TOPIC: core.audit.access
      AUDIT_BATCH_SIZE: "100"
      AUDIT_BATCH_LATENCY_MS: "1000"
      ENFORCE_ADMIN: "false"
      CORE_DB_HOST: core-db
      CORE_DB_PORT: "5432"
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASSWORD: core
      LOG_LEVEL: info
    ports:
      - "3005:3005"
    depends_on:
      kafka:
        condition: service_healthy
      core-db:
        condition: service_healthy
    networks:
      - core

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: dashboard
    environment:
      NODE_ENV: development
      DASHBOARD_PORT: "3000"
      FHIR_BASE_URL: http://fhir-facade:3003
      CDS_BASE_URL: http://cds-hooks:3004
      AUDIT_BASE_URL: http://audit:3005
      REPLICATION_BASE_URL: http://replication:3007
      EDGE_FHIR_BASE_URL: http://edge-su:3003
      TERMINOLOGY_BASE_URL: http://terminology:3008
      MAPPING_ASSISTANT_BASE_URL: http://mapping-assistant:3009
    # Host-port 3010 för att undvika kollision med andra lokala dev-servrar på 3000.
    ports:
      - "3010:3000"
    depends_on:
      - fhir-facade
      - cds-hooks
      - audit
    networks:
      - core

  # --- Fas 3 demo-yta: statisk dashboard-build (nginx) ---
  # Serverar vite-builden + reverse-proxar /api/med-review (SSE) + /api/aql-templates
  # till de co-lokaliserade tjänsterna. Endast /med-review + /compose-demo har
  # backends här; övriga vyer 503. INTERN ONLY (mock-auth-skuld gatekeepar publik
  # exponering). Separat från dev-tjänsten `dashboard` ovan (vite dev-server).
  dashboard-demo:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile.demo
    container_name: dashboard-demo
    ports:
      - "3012:80"
    depends_on:
      med-review:
        condition: service_healthy
      aql-template-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - core
      # carlius-net: så cloudflared (på carlius-net) når tjänsten via docker-DNS
      # (nimloth-demo:80) för Cloudflare-tunneln. Endast på cf4 där nätet finns.
      - carlius-net

  # --- Terminologitjänst (Sprint 1, P1) ---
  # Tunn proxy framför Snowstorm/HAPI med fallback-data inbakad. Startar
  # alltid i fallback-mode; upstream aktiveras genom att sätta
  # SNOWSTORM_URL och HAPI_TERMINOLOGY_URL (se profilen "terminology-full"
  # nedan för en exempelkonfiguration med Snowstorm-lite).
  terminology:
    build:
      context: .
      dockerfile: services/terminology/Dockerfile
    container_name: terminology
    environment:
      NODE_ENV: production
      TERMINOLOGY_PORT: "3008"
      LOG_LEVEL: info
      # Lämna SNOWSTORM_URL/HAPI_TERMINOLOGY_URL tomma för fallback-only läge.
      # Aktivera genom att starta med profilen "terminology-full" och
      # sätt URL:erna nedan.
      SNOWSTORM_URL: ${SNOWSTORM_URL:-}
      HAPI_TERMINOLOGY_URL: ${HAPI_TERMINOLOGY_URL:-}
    ports:
      - "3008:3008"
    networks:
      - core

  # --- Mapping-assistant (Sprint 2, P4) ---
  # AI-assisterad mapping: föreslår TS-mappers från databas-schema, observerar
  # kvalitetsmetrics, frågar vid låg confidence. Skriver bara till proposed/-
  # mappen — manuell granskning enda vägen till produktion. Använder
  # @nimloth-core/model-router för att routa LLM-anrop med data-residency-policy.
  mapping-assistant:
    build:
      context: .
      dockerfile: services/mapping-assistant/Dockerfile
    container_name: mapping-assistant
    environment:
      NODE_ENV: production
      MAPPING_ASSISTANT_PORT: "3009"
      LOG_LEVEL: info
      # Audit till Kafka
      KAFKA_BROKERS: kafka:29092
      MAPPING_AUDIT_TOPIC: core.audit.mapping
      # Model-router-config (mountad från ./config nedan)
      MODEL_ROUTING_CONFIG: /app/config/model-routing.yaml
      # Anthropic-key — läses lazy. Saknas key = providern är "unhealthy" och
      # routern faller tillbaka till mock-providern. Tjänsten startar ändå.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Vägrar starta vid manipulerade prompts
      REQUIRE_VALID_PROMPTS: "true"
    volumes:
      # Persistent SQLite för förslag + audit-outbox
      - mapping-assistant-data:/data
      # Skriv föreslagna mappers till repots transform-mapp så de kan granskas
      - ./services/transform/src/mappings/proposed:/app/services/transform/src/mappings/proposed
    ports:
      - "3009:3009"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - core

  # --- Snowstorm-lite (SNOMED CT, valfri) ---
  # Aktiveras med profilen "terminology-full":
  #   docker compose --profile terminology-full up -d
  # Image: ~100 MB, kräver SNOMED-licens-validerad subset.
  # Sätt SNOWSTORM_URL=http://snowstorm:8080/fhir på terminology-tjänsten.
  snowstorm:
    image: snomedinternational/snowstorm-lite:latest
    container_name: snowstorm
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "8090:8080"
    profiles: ["terminology-full"]
    networks:
      - core

  # --- HAPI FHIR Terminology (LOINC + ICD-10-SE, valfri) ---
  # Aktiveras med profilen "terminology-full".
  # Bootstrap av LOINC + ICD-10-SE måste göras separat efter första start.
  hapi-fhir-terminology:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir-terminology
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
    ports:
      - "8091:8080"
    profiles: ["terminology-full"]
    networks:
      - core

  # --- EHRbase (Sprint 2, P3) ---
  # openEHR clinical data repository som parallellt kanoniskt lager.
  # Composer-tjänsten (P3.2) skriver compositions hit; FHIR Facade läser
  # via AQL-broker (P3.3). I Fas 3.0 används EHRbase enbart för verifiering
  # av template-load via /definition/template/adl1.4-endpointen.
  #
  # Image-SHA verifierad mot Docker Hub 2026-04-27. Pinning säkerställer
  # reproducerbar deploy. Uppgradering sker via dokumenterat arbetsflöde i
  # infra/openehr/compiler/CHANGELOG.md.
  ehrbase-db:
    # ehrbase-v2-postgres innehåller temporal_tables + jsquery-extensions
    # som EHRbase 2.x kräver. Skapar ehrbase + ehrbase_admin-roller via initdb.
    image: ehrbase/ehrbase-v2-postgres:16.2@sha256:abe14e8f9ba33cabc9946c6c17c5aa95b64b35387f266cd20a894149203196d7
    container_name: ehrbase-db
    environment:
      POSTGRES_PASSWORD: postgres
      EHRBASE_USER: ehrbase
      EHRBASE_PASSWORD: ehrbase
      EHRBASE_USER_ADMIN: ehrbase_admin
      EHRBASE_PASSWORD_ADMIN: ehrbase_admin
    volumes:
      - ehrbase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - core

  # --- kafka-test-producer (Sprint 2, P3.2) ---
  # Tooling-tjänst för att producera test-events till Kafka inifrån docker-network
  # (kringgår advertised-listener-mismatch när host-port 9092 är override-mappad).
  # Kör inte by default — aktiveras med profil "kafka-tools":
  #   docker compose --profile kafka-tools run --rm kafka-test-producer fru-andersson
  kafka-test-producer:
    build:
      context: .
      dockerfile: packages/kafka-test-producer/Dockerfile
    container_name: kafka-test-producer
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - core
    profiles: ["kafka-tools"]

  # --- openehr-composer (Sprint 2, P3.1 + P3.2) ---
  # P3.1: HTTP-event-endpoint + ehr-cache + composition-builder.
  # P3.2: Kafka-consumer på core.clinical.* + outbox-mönster + processor.
  # Composern startar utan Kafka (KAFKA_ENABLED=false) — då fungerar bara
  # HTTP-vägen + outbox-processor.
  openehr-composer:
    build:
      context: .
      dockerfile: services/openehr-composer/Dockerfile
    container_name: openehr-composer
    environment:
      NODE_ENV: production
      COMPOSER_PORT: "3015"
      LOG_LEVEL: info
      EHRBASE_URL: http://ehrbase:8080
      CORE_DB_HOST: core-db
      CORE_DB_PORT: "5432"
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASSWORD: core
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: core-openehr-composer
      OUTBOX_POLL_INTERVAL_MS: "1000"
      OUTBOX_BATCH_SIZE: "10"
      OUTBOX_MAX_ATTEMPTS: "5"
      EXPECTED_TEMPLATES: "time_series.en.v1,minimal_action.en.v1,medication_summary.v1,problem_diagnosis.v1,adverse_reaction_risk.v2"
    ports:
      - "3015:3015"
    depends_on:
      core-db:
        condition: service_healthy
      ehrbase:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - core

  ehrbase:
    image: ehrbase/ehrbase:2.30.1@sha256:c08be93f41164bb6ba8e957532ce4cccd18e6b9d26e074ef97f3faff9c3cd52f
    container_name: ehrbase
    environment:
      DB_URL: jdbc:postgresql://ehrbase-db:5432/ehrbase
      DB_USER: ehrbase
      DB_PASS: ehrbase
      DB_USER_ADMIN: ehrbase_admin
      DB_PASS_ADMIN: ehrbase_admin
      SECURITY_AUTHTYPE: NONE
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: env,health,info,metrics,prometheus
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    ports:
      - "8088:8080"
    depends_on:
      ehrbase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ehrbase/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - core

  # --- aql-template-service (Fas 2 Kontrakt 1; Fas 3 AC1 co-located) ---
  # Co-locerad bredvid ehrbase så service→EHRbase blir loopback (docker-nät),
  # inte ett LAN-hopp. Triggad av agent-last-benchmark (P95 502ms > 500 budget).
  # Intern only — ingen publik tunnel (mock-auth-skuld gatar publik exponering).
  aql-template-service:
    build:
      context: .
      dockerfile: services/aql-template-service/Dockerfile
    container_name: aql-template-service
    environment:
      NODE_ENV: production
      PORT: "3010"
      LOG_LEVEL: info
      EHRBASE_BASE_URL: http://ehrbase:8080/ehrbase
    ports:
      - "3010:3010"
    depends_on:
      ehrbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3010/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - core

  # --- med-review (Fas 3 AC5/AC6) — AI-medicineringsgenomgång ---
  # Co-locerad: agent→aql-template-service→EHRbase allt loopback (docker-nät).
  # Klinisk bedömning i deterministiska regelmotorer (S1); LLM-syntes via
  # Anthropic (ANTHROPIC_API_KEY krävs för LLM-väg, annars deterministisk
  # fallback). Intern only — ingen publik tunnel (mock-auth-skuld kvarstår).
  med-review:
    build:
      context: .
      dockerfile: services/med-review/Dockerfile
    container_name: med-review
    environment:
      NODE_ENV: production
      PORT: "3011"
      LOG_LEVEL: info
      AQL_TEMPLATE_BASE_URL: http://aql-template-service:3010
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MED_REVIEW_SYNTH_MODEL: ${MED_REVIEW_SYNTH_MODEL:-claude-opus-4-7}
    ports:
      - "3011:3011"
    depends_on:
      aql-template-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3011/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - core

volumes:
  melior-data:
  asynja-data:
  core-data:
  kafka-data:
  mapping-assistant-data:
  ehrbase-data:

networks:
  core:
    name: nimloth-core
    driver: bridge
  # Externt nät (cloudflared + nimloth-atlas) — finns på cf4, skapas ej här.
  # Endast dashboard-demo ansluts (för tunnel-ingress via docker-DNS).
  carlius-net:
    external: true
