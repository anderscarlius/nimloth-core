name: Cohort-service — bygg och pusha

# CI/CD-temat 2026-08-19. Egen, path-filtrerad workflow — triggar inte på
# orelaterade nimloth-core-commits. Root-CI:ns testloop (ci.yml) kör inte
# cohort-service idag (hårdkodad paketlista utan cohort-service); denna
# workflow har därför sin egen test-grind i stället för att förlita sig på
# ci.yml, så nya tester här faktiskt verifieras innan push.

on:
  push:
    branches: [main]
    paths:
      - "services/cohort-service/**"
      - "packages/**"
      - ".github/workflows/cohort-service-publish.yml"

jobs:
  test:
    name: Unit-tester (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "@nimloth-core/cohort-service" build
      - run: pnpm --filter "@nimloth-core/cohort-service" test

  publish:
    name: Bygg och pusha till ghcr.io
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nimloth-core-cohort-service
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cohort-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
