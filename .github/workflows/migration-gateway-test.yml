name: Migration-gateway — test

# B4 Etapp 1. Path-filtrerad, som cohort-service-publish.yml — root-CI:ns
# testloop kör inte migration-gateway (hårdkodad paketlista). Ingen
# ghcr-publish denna etapp (S1 — lokalt bara, deploy är en egen
# beslutspunkt i en senare etapp).

on:
  push:
    branches: [main]
    paths:
      - "services/migration-gateway/**"
      - "packages/**"
      - ".github/workflows/migration-gateway-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/migration-gateway/**"
      - "packages/**"

jobs:
  test:
    name: Unit-tester (Vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5435"
      PGDATABASE: core
      PGUSER: core
      PGPASSWORD: core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "@nimloth-core/migration-gateway" build
      - run: pnpm --filter "@nimloth-core/migration-gateway" test
