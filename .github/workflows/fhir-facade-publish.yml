name: FHIR-facade — bygg och pusha

# Block 8 steg 3 (2026-09-06) — fru-andersson-slice, mönsterbevis för
# huvudstacken. Egen, path-filtrerad workflow, samma tvåjobbs-mönster som
# cohort-service-publish.yml (test → publish till ghcr.io) — vald mall
# eftersom fhir-facades testsvit är hermetisk precis som cohort-services:
# den enda DB-beroende testen (dual-store-e2e.test.ts) är describe.skip
# om inte E2E_LIVE=1 sätts, vilket den aldrig gör här. Inget Postgres-
# services:-block behövs, till skillnad från migration-gateway-publish.yml.
#
# paths nedan är SKÄRPT mot vad services/fhir-facade/Dockerfile faktiskt
# COPY:ar (packages/shared + packages/kafka-utils, inte hela packages/) —
# inte en blank packages/**-kopia av cohort-service/migration-gateway-
# mallen, som själva kopierar hela packages/ i sina Dockerfiles och därför
# korrekt använder ett bredare filter.
#
# Medvetet UTAN: workflow_dispatch (cohort-service-mallen saknar den
# också), verify-from-scratch/B4-jobb (hör bara hemma i migration-gateway,
# se S3 i den styrande sessionen).

on:
  push:
    branches: [main]
    paths:
      - "services/fhir-facade/**"
      - "packages/shared/**"
      - "packages/kafka-utils/**"
      - ".github/workflows/fhir-facade-publish.yml"

jobs:
  test:
    name: Unit-tester (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "@nimloth-core/fhir-facade" build
      - run: pnpm --filter "@nimloth-core/fhir-facade" test

  publish:
    name: Bygg och pusha till ghcr.io
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nimloth-core-fhir-facade
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/fhir-facade/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
