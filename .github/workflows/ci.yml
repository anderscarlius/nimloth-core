name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build all workspaces
        run: pnpm -r build

      - name: Run unit tests (skip workspaces without tests)
        run: |
          for pkg in shared cds-hooks edge transform replication; do
            echo "=== @nimloth-core/$pkg ==="
            pnpm --filter "@nimloth-core/$pkg" test
          done
