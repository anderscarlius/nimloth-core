name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate Eldar ehrbase compose (config only)
        run: |
          docker compose \
            -f deploy/core-slice/docker-compose.ehrbase-only.yml \
            -f deploy/core-slice/docker-compose.eldar.yml \
            config --quiet

      - name: WP-DEMO1 — validate demo-slice shell scripts
        run: |
          bash -n deploy/demo-slice/up-local-unified.sh
          bash -n deploy/demo-slice/run-stack-health-check.sh
          bash -n deploy/demo-slice/run-aql-fhir-vitals-proof.sh

      - name: Build all workspaces
        run: pnpm -r build

      - name: Run unit tests (skip workspaces without tests)
        run: |
          for pkg in shared cds-hooks edge transform replication; do
            echo "=== @nimloth-core/$pkg ==="
            pnpm --filter "@nimloth-core/$pkg" test
          done

      - name: WP-EVT1 — domain event contract tests
        run: |
          pnpm --filter @nimloth-core/openehr-composer test
          pnpm --filter @nimloth-core/domain-event-audit-sink test
          pnpm --filter @nimloth-core/domain-event-lakehouse-stub test
