# =====================================================================
# Dashboard DEMO — nginx-config (Fas 3, intern demo-yta på cf4:11005).
#
# 1. Serverar vite-builden (SPA-fallback för react-router).
# 2. Reverse-proxar /api/med-review (SSE) + /api/aql-templates till de
#    co-lokaliserade tjänsterna på docker-nätet 'core'.
# 3. Root → /med-review (demo-landning; undviker den backend-lösa /search).
# 4. Okända /api/* → 503 (i st.f. att serva index.html som "JSON").
#
# OBS: bara /med-review + /compose-demo har backends på cf4. Övriga ops-vyer
# (search/system/topology/audit/mappings/cds/parity) saknar tjänster här.
# INTERN ONLY — ingen publik tunnel (mock-auth-skuld gatekeepar exponering).
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relativa redirects — containern lyssnar på :80 men exponeras på :11005;
    # absolut redirect skulle tappa porten (→ port 80). Relativt bevarar origin.
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # --- Health ---
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Demo-landning: root → /med-review (server-side, rör ej SPA-källan) ---
    location = / {
        return 302 /med-review;
    }

    # --- med-review (SSE) — buffring AV så EventSource strömmar token-för-token ---
    location /api/med-review/ {
        proxy_pass http://med-review:3011/api/med-review/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # --- aql-template-service (Fas 2 mallar; ingen rewrite, servicen exponerar pathen) ---
    location /api/aql-templates/ {
        proxy_pass http://aql-template-service:3010/api/aql-templates/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # --- Övriga /api/* har inga backends på cf4 → tydlig 503 (ej index.html) ---
    location /api/ {
        return 503 "Tjänsten är inte deployad i denna demo-miljö (endast med-review + aql-templates).\n";
        add_header Content-Type text/plain always;
    }

    # --- Hash-immutable vite-assets ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # --- SPA-fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
