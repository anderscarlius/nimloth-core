pathway_id: aldre_multisjuk_pathway
initial_state: medication_review_visit

states:
  medication_review_visit:
    compositions: [primary_care_encounter, vital_signs, lab_order]
    day_offset: 0
    transitions:
      - to: review_results
        condition: always

  review_results:
    compositions: [lab_result, problem_diagnosis]
    day_offset: { min: 1, max: 5 }
    transitions:
      - to: medication_review
        condition: always
        compositions: [medication_statement]

  medication_review:
    compositions: [care_plan, medication_statement]
    day_offset: { min: 7, max: 21 }
    transitions:
      - to: geriatrics
        condition: "severity == severe"
        compositions: [referral]
      - to: followup
        condition: always

  geriatrics:
    compositions: [specialist_consultation]
    day_offset: { min: 30, max: 90 }
    transitions:
      - to: followup
        condition: always

  followup:
    compositions: [vital_signs, lab_result, care_plan]
    day_offset: { min: 60, max: 150 }
    transitions:
      - to: terminal
        condition: always

  terminal:
    terminal: true
